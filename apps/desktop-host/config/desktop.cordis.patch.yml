# 本 fork 的 Desktop 覆盖层 patch：由 apps/desktop-host/src/index.ts 以 patch overlay
# 显式加载（上游 0.1.6-alpha.2 起 desktop-host 改为共享 Web 运行时组装，不再自动读本文件），
# 随桌面运行时一起分发，故换机、重装后都不需要手工重做。
#
# 开启会话内容全文搜索。上游 base/web-app 两层都把它配成 openAt: never（禁用），
# 侧边栏搜索因此只匹配会话标题与工作区名。path 指向 harness cache 目录下的持久索引
# （:memory: 会在每次应用重启后重建）；first-search 让首次搜索才打开索引，避免拖慢启动。
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('cache', 'session-query.sqlite')
    openAt: first-search
